# Workspace root — not itself a published package. Python members live in
# packages/* (orchestrator, switch, office). packages/bridge is the Node
# package (@icaro0310/devin-bridge) managed by the npm workspace.

[project]
name = "devin-control"
version = "0.0.0"
description = "Monorepo workspace for the devin-control product: bridge, orchestrator, switch, office."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
# asset-generation one-off scripts, not shipped code
extend-exclude = ["packages/office/tools"]

[tool.ruff.lint.per-file-ignores]
# monitoring daemon/collectors are deliberately fail-soft: a probe must never
# crash the HTTP server
"packages/office/**" = ["BLE001", "S110", "S112"]

[tool.uv.workspace]
members = ["packages/orchestrator", "packages/switch", "packages/office"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
