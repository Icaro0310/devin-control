[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-switch"
version = "0.1.0"
description = "Switch between Devin configuration profiles (hooks, MCP, models) with snapshot and verification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.2"]
mcp = ["mcp>=1.2"]

[project.scripts]
devin-switch = "devin_switch.cli:main"
devin-switch-mcp = "devin_switch.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devin_switch = ["profiles/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
