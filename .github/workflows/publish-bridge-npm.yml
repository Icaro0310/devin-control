name: publish-bridge-npm

# Publishes @icaro0310/devin-bridge to npmjs.com from packages/bridge.
# Requires repo secret NPM_TOKEN (granular access token, automation type).
# Triggers: publishing a GitHub Release tagged bridge-v*, or manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'bridge-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Supply-chain guard: a bridge-v* tag on an unmerged commit must not
      # publish unreviewed code (same check the reusable release fan-out
      # runs in detect).
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac

      - working-directory: packages/bridge
        run: npm test

      # Idempotent: a re-dispatched run after the version already reached
      # npm must skip instead of failing on E403 duplicate.
      - name: Skip if version already published
        id: dup
        working-directory: packages/bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@icaro0310/devin-bridge@$v" version >/dev/null 2>&1; then
            echo "::warning::$v already on npmjs.com — skipping publish"; echo "dup=true" >> "$GITHUB_OUTPUT"
          else
            echo "dup=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dup.outputs.dup != 'true'
        working-directory: packages/bridge
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
