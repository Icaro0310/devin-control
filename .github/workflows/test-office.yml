name: test-office

on:
  push:
    branches: [main]
    paths:
      - 'packages/office/**'
      - '.github/workflows/test-office.yml'
  pull_request:
    paths:
      - 'packages/office/**'
      - '.github/workflows/test-office.yml'

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1
    with:
      package-dir: packages/office
