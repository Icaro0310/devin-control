name: publish-bridge-gpr

# Publishes @icaro0310/devin-bridge to GitHub Packages from packages/bridge.
# Triggers: publishing a GitHub Release tagged bridge-v*, or manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'bridge-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@icaro0310"

      # Supply-chain guard: a bridge-v* tag on an unmerged commit must not
      # publish unreviewed code (same check the reusable release fan-out
      # runs in detect).
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac

      # Dispatch must carry the same tag==manifest proof as a release
      # event: require a `bridge-v*` tag on THIS commit matching
      # packages/bridge/package.json — otherwise a dispatch against any
      # merged commit could publish whatever version is checked out.
      - name: Require tag matching manifest on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/bridge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          want="bridge-v$(node -p "require('./package.json').version")"
          ref=$(gh api "repos/${{ github.repository }}/git/refs/tags/$want" 2>/dev/null || true)
          [ -n "$ref" ] || { echo "::error::no tag $want exists — dispatch only publishes the tagged release commit"; exit 1; }
          sha=$(echo "$ref" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")
          typ=$(echo "$ref" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['type'])")
          if [ "$typ" != "commit" ]; then
            sha=$(gh api "repos/${{ github.repository }}/git/tags/$sha" --jq .object.sha)
          fi
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::tag $want does not point at $GITHUB_SHA — refusing to publish"; exit 1; }

      # Idempotent: a re-dispatched run after the version already reached
      # GPR must skip instead of failing on a duplicate-version error.
      - name: Skip if version already published
        id: dup
        working-directory: packages/bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@icaro0310/devin-bridge@$v" version >/dev/null 2>&1; then
            echo "::warning::$v already on GitHub Packages — skipping publish"; echo "dup=true" >> "$GITHUB_OUTPUT"
          else
            echo "dup=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dup.outputs.dup != 'true'
        working-directory: packages/bridge
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
