name: publish

# Publishes the package matching the pushed tag (or the selected dispatch
# input) to PyPI via Trusted Publishing (OIDC). The upload job must live in
# this file: PyPI matches job_workflow_ref against this workflow's path.

on:
  push:
    tags: ['orchestrator-v*','switch-v*','office-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - orchestrator
          - switch
          - office

permissions:
  contents: read

jobs:
  # A tag/dispatch run ships exactly one package: resolve it once here so
  # the gate only verifies the selected wheel — a version mismatch in the
  # other package must not block this release.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.pkg.outputs.dir }}
      mod: ${{ steps.pkg.outputs.mod }}
      publisher: ${{ steps.pkg.outputs.publisher }}
      # dist/cli feed the post-publish smoke leg below: dist is the PyPI
      # project name (orchestrator ships as devin-fanout), cli is the
      # console script the smoke probes.
      dist: ${{ steps.pkg.outputs.dist }}
      cli: ${{ steps.pkg.outputs.cli }}
    steps:
      - id: pkg
        env:
          REF: ${{ github.ref_name }}
          SEL: ${{ inputs.package }}
        run: |
          base="${SEL:-${REF%%-v*}}"
          case "$base" in
              orchestrator) echo "dir=packages/orchestrator" >> "$GITHUB_OUTPUT"
                            echo "mod=devin_orchestrator" >> "$GITHUB_OUTPUT"
                            echo "publisher=pypi" >> "$GITHUB_OUTPUT"
                            echo "dist=devin-fanout" >> "$GITHUB_OUTPUT"
                            echo "cli=devin-orchestrator" >> "$GITHUB_OUTPUT" ;;
                  switch) echo "dir=packages/switch" >> "$GITHUB_OUTPUT"
                          echo "mod=devin_switch" >> "$GITHUB_OUTPUT"
                          echo "publisher=pypi-switch" >> "$GITHUB_OUTPUT"
                          echo "dist=devin-switch" >> "$GITHUB_OUTPUT"
                          echo "cli=devin-switch" >> "$GITHUB_OUTPUT" ;;
                  office) echo "dir=packages/office" >> "$GITHUB_OUTPUT"
                          echo "mod=devin_office" >> "$GITHUB_OUTPUT"
                          echo "publisher=pypi-office" >> "$GITHUB_OUTPUT"
                          echo "dist=devin-office" >> "$GITHUB_OUTPUT"
                          echo "cli=devin-office" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package: $base" >&2; exit 1 ;;
          esac

  # Wheel __version__ gate lives in one place — verified before publish runs.
  verify:
    needs: resolve
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@7db127668a6b5c3fa396a4853dcf25865e3a4d2c # v1
    with:
      package-dir: ${{ needs.resolve.outputs.dir }}
      module: ${{ needs.resolve.outputs.mod }}
      python-version: "3.12"

  publish:
    # needs.resolve makes the environment follow the resolved package —
    # a dispatch on a foreign tag ref can never pick the wrong
    # trusted-publisher env again.
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.publisher }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Publish the exact dist/ that passed the verify gate — never a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Supply-chain guard: wheels once reached PyPI via dispatch from
      # unmerged branches elsewhere in the ecosystem. Refuse to upload
      # when the publish origin is not merged.
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # No password: a set token disables Trusted Publishing (OIDC).
          # There is no token fallback — do not reintroduce PYPI_API_TOKEN.
          packages-dir: dist
          skip-existing: true

  # Post-publish smoke: the index must serve the exact version that was
  # uploaded and a clean install must run its console script — a green
  # upload with a broken wheel fails here instead of shipping silently.
  # Neutral environment (no trusted-publisher env): smoke needs network
  # only, no id-token.
  smoke:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      # The version comes from the wheel that was actually uploaded —
      # dispatch runs carry no tag to parse it from.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Wait for PyPI to serve the published wheel
        id: pypi
        env:
          DIST: ${{ needs.resolve.outputs.dist }}
        run: |
          ver=$(python -c "import pathlib; print(next(pathlib.Path('dist').glob('*.whl')).name.split('-')[1])")
          whl=$(basename dist/*.whl)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          # Poll for the wheel filename itself, not the version string:
          # a version-only match also accepts a lone sdist and would smoke
          # green while the verified wheel never landed on the index.
          echo "waiting for $whl on https://pypi.org/simple/$DIST/"
          for i in $(seq 1 32); do
            if curl -fsSL "https://pypi.org/simple/$DIST/" | grep -qF -- "$whl"; then
              echo "served after ~$((i * 15))s of polling"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$whl never appeared on PyPI within ~8m — publish looks broken"
          exit 1
      - name: Install the published dist and run its CLI
        env:
          DIST: ${{ needs.resolve.outputs.dist }}
          CLI: ${{ needs.resolve.outputs.cli }}
          VER: ${{ steps.pypi.outputs.ver }}
        run: |
          # venv+pip, not uv tool: no uv install exists in this workflow,
          # and the throwaway venv keeps the probe fully isolated anyway.
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-cache-dir "$DIST==$VER"
          test -x "/tmp/smoke/bin/$CLI"
          "/tmp/smoke/bin/$CLI" --help >/dev/null
          echo "smoke ok: $DIST==$VER serves $CLI"
