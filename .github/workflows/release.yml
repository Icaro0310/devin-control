name: release

# Per-package GitHub releases: a tag `<pkg>-vX.Y.Z` builds, signs and
# publishes a release for packages/<pkg> only (orchestrator, switch).
# PyPI publishing is a separate workflow (pypi-publish.yml) triggered by
# the same tag. `bridge-v*` tags belong to release-bridge.yml — the
# extension + npm fan-out caller — so they are intentionally absent here.
# office is source-only and has no tag pattern.

on:
  push:
    tags:
      - "orchestrator-v*"
      - "switch-v*"

permissions:
  contents: write

jobs:
  release-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve package dir from tag
        run: echo "PKG_DIR=packages/${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          python -m pip install -e "${PKG_DIR}[dev]" build
          python -m pytest -q "$PKG_DIR"
          python -m build "$PKG_DIR" --outdir "$PKG_DIR/dist"

      - name: Generate SBOM
        run: pipx run --spec cyclonedx-bom cyclonedx-py environment
          "$(which python)" --pyproject "$PKG_DIR/pyproject.toml" --mc-type library
          -o sbom.cdx.json

      - name: Sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY not configured; skipping signing"
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(printf '%s' "$GPG_PRIVATE_KEY" | \
            gpg --batch --import --show-keys --with-colons | \
            awk -F: '/^fpr/{print $10; exit}')
          for f in "$PKG_DIR"/dist/* sbom.cdx.json; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$KEYID" --armor --detach-sign "$f"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "$PKG_DIR"/dist/* sbom.cdx.json* --verify-tag --generate-notes
